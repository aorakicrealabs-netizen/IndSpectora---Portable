services:
  indspectora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indspectora-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: "${APP_URL:-http://localhost:3000}"
    volumes:
      # Persists SQLite database (data/indspectora.db) and uploaded photos/drawings (data/uploads/)
      - ./data:/app/data
    restart: unless-stopped
